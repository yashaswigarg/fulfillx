spring.application.name=fulfillx-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fulfillx}
spring.datasource.username=${DB_USERNAME:fulfillx}
spring.datasource.password=${DB_PASSWORD:fulfillx_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=FulfillX
info.app.description=Production-style ecommerce and fulfillment platform
info.app.version=1.0.0

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

aws.region=${AWS_REGION:ap-south-1}
aws.eventbridge.bus-name=${AWS_EVENTBRIDGE_BUS:default}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL}
aws.s3.bucket-name=${AWS_S3_BUCKET:kalasetu-artisan-crafts}