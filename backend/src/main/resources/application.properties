spring.application.name=karigarsetu-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/karigarsetu}
spring.datasource.username=${DB_USERNAME:karigarsetu}
spring.datasource.password=${DB_PASSWORD:karigarsetu_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

info.app.name=KarigarSetu
info.app.description=KarigarSetu artisan marketplace and fulfillment platform
info.app.version=1.0.0

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

aws.region=${AWS_REGION:ap-south-1}
aws.eventbridge.bus-name=${AWS_EVENTBRIDGE_BUS:default}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL}
aws.s3.bucket-name=${AWS_S3_BUCKET:karigarsetu-artisan-crafts}