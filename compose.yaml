services:

  postgres:
    image: postgres:16
    container_name: fulfillx-postgres

    environment:
      POSTGRES_DB: fulfillx
      POSTGRES_USER: fulfillx
      POSTGRES_PASSWORD: fulfillx_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fulfillx -d fulfillx" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: fulfillx-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fulfillx
      DB_USERNAME: fulfillx
      DB_PASSWORD: fulfillx_dev_password
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 3600000
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_EVENTBRIDGE_BUS: ${AWS_EVENTBRIDGE_BUS:-default}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL}

    ports:
      - "8080:8080"

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1

    container_name: fulfillx-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
